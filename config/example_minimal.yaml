# ==============================================================
# Minimal project config. Everything not shown takes its default;
# template.yaml lists every setting.
# ==============================================================

project:
    name: example_minimal
    root: /storage/data/palm/example
    output_dir: ./gis

input:
    static_driver: INPUT/example_static_N02
    p3d:           INPUT/example_p3d_N02   # or: advanced.grid.nz + .dz
    data_3d:       OUTPUT/DATA_3D_NETCDF_N02
    surface_data:  OUTPUT/SURFACE_DATA_NETCDF_N02

voxel:
    variables: [u, v, w, theta]
    netcdf:
        file: example_voxel.nc

surfaces:
    variables: [theta_surface]
    all_elements_gpkg:
        file: example_surfaces.gpkg

wind:
    # Gridded wind for ArcGIS's flow renderer - one netCDF per absolute
    # height, by default every level of the voxel's range, all in the
    # folder example_wind/:
    netcdf:
        file: example_wind.nc
        every_nth_column: 4

# The rest takes its default: CRS from the static driver, region and time
# = no cut, units = degrees C for air and surface temperatures and K for
# potential temperatures, canopy off (no section).

# ==============================================================
# palm2gis configuration - FULL REFERENCE
# ==============================================================
# This file documents every setting and is self-sufficient (copy it as-is
# and it works after filling the paths). Hardcoded defaults are applied
# BEFORE this file, and the merge is deep - a project config only needs to
# state what differs from the defaults. See config/example_minimal.yaml
# for what that looks like in practice.
#
# Template: copy to config/<project>.yaml and edit.
# Run:  python run_palm2gis.py -c config/<project>.yaml
# Relative paths resolve against project.root (default: this file's
# directory); output paths additionally resolve against project.output_dir.
# ==============================================================

project:
  name: project_name
  # Base directory for all relative paths below. Default (null) = the
  # directory of this YAML file; since project configs live in config/,
  # point root at the simulation data directory instead:
  root: /storage/data/palm/project_name
  output_dir: ./gis                   # all generated layers go here
                                      # (relative to project.root)
  overwrite: false                    # false: an existing output file is KEPT
                                      # and its product skipped, so a rerun
                                      # only fills in what is missing.
                                      # true: regenerate everything, replacing
                                      # existing outputs (--overwrite does the
                                      # same for one run)

crs:
  # CRS of the PALM coordinate system. origin_x/origin_y from the static
  # driver are interpreted in this CRS and EVERY output layer is written in
  # it (absolute coordinates), so ArcGIS/QGIS place the layers correctly
  # with no manual shifting.
  palm: "EPSG:32633"

domain:
  # [required] Static driver of the domain the outputs belong to - for a
  # child domain the *_static_N02 file. Provides nx, ny, dx, dy, the
  # terrain + building elevation, origin_x/origin_y and origin_time.
  static_driver: INPUT/project_static_N02
  # nz and dz are NOT in the static driver. Either point at the matching
  # _p3d namelist (parsed with a regex on `key = value` pairs) ...
  p3d: INPUT/project_p3d_N02
  # ... or state them explicitly (explicit values win over the p3d file):
  nz: null
  dz: null
  # Timestamps in every output = origin_time + PALM's time-in-seconds.
  # Default (null) = the static driver's origin_time attribute; a PALM-style
  # UTC-offset suffix ("... +02") is accepted and dropped. Override here
  # when the attribute is missing or wrong:
  origin_time: null                   # "YYYY-MM-DD HH:MM:SS"

bounds:
  # Cut a subdomain, in metres, LOCAL PALM coordinates (same convention as
  # the paraview_vis tool). Leave a key out for no cut in that direction.
  x0: 100
  xmax: 300
  y0: 100
  ymax: 300
  # zmax = height ABOVE the highest surface (terrain + buildings) inside
  # the cut subdomain; the vertical index range is derived from it.
  zmax: 40
  # Timestep window. skip_times is how many records to skip from the
  # start; n_times is how MANY records to convert after that.
  #
  # CHANGED IN 0.10.0: n_times used to be the exclusive END index, so
  # skip_times: 10 with n_times: 5 selected nothing at all. It is a count
  # now. Set `time_end` instead if you want the old end-index meaning:
  #   skip_times: 2, n_times: 5   -> records 2,3,4,5,6   (5 records)
  #   skip_times: 2, time_end: 5  -> records 2,3,4       (up to index 5)
  # Clamped per file, since 3D and surface output use separate intervals.
  skip_times: 0
  n_times: 99999
  # time_end: null      # alternative to n_times: exclusive end index
  # Some PALM files - surface output in particular - are written with the
  # time variable left at its _FillValue, so they carry no timestamps at all
  # (the run warns about it). Give the output interval in seconds here to
  # reconstruct them; without it, those outputs are labelled by record index
  # (raster band "record 3", the `rec` column in the GeoPackages) and their
  # `time` field is empty.
  # Leave both null/0 and palm2gis works it out: when a file's time
  # variable is unusable it reads the output interval from the p3d
  # namelist - dt_dosurf_av / dt_dosurf for surface output,
  # dt_data_output_av / dt_data_output for 3D - together with the matching
  # skip_time_*, and places the first record one interval in. PALM keeps
  # these settings separate per product, so a 10-minute 3D file and an
  # hourly surface file in the same run are handled correctly.
  # Set them only to override that, or when there is no p3d.
  time_step: null                     # [s] output interval
  time_start: null                    # [s] time of the FIRST record

# --------------------------------------------------------------
# Stage: voxel - 3D output -> CF NetCDF for the ArcGIS Pro Voxel Layer
# --------------------------------------------------------------
# In ArcGIS Pro: Local Scene -> Add Data -> Multidimensional Voxel Layer.
# Terrain/building cells are NoData (_FillValue = -9999).
#
# NOTE on file_from (applies to ALL stages): palm2gis reads RAW PALM output
# - local metre coordinates, kelvin, original variable layout - and applies
# origin_x/origin_y and unit handling itself, from the static driver. If
# the run is segmented into parts, join them first with the palm_postproc
# `join` step and point file_from at the OUTPUT_join/ file. NEVER point it
# at splitvar/splitz/splittime/coord output: palm2gis and palm_postproc are
# parallel branches after `join`, not a chain. A coord-processed file
# (absolute UTM coordinates, degrees C) is detected and rejected at start.
voxel:
  enabled: true
  file_from: OUTPUT/DATA_3D_NETCDF_N02
  file_to: project_voxel.nc           # relative -> project.output_dir
  do_velocity: true                   # destagger and write u, v, w
  scalars: ["theta"]                  # scalars copied (and cut) as-is
  # Drop the z = 0 level so vertical spacing is uniform (dz/2, 3dz/2, ...).
  # Voxel layers handle a uniform spacing best; keep true unless you
  # specifically need the surface level.
  drop_k0: true
  # Ensure `ta` (actual AIR TEMPERATURE) is present. If the file already
  # holds PALM's own `ta` it is copied - that value is exact. Only when it
  # is absent is it reconstructed from potential temperature:
  # T = theta * Pi, with the Exner function Pi integrated hydrostatically
  # up the column (dPi/dz = -g/(cp*theta)) from surface_pressure below.
  # Roughly theta - 0.98 K per 100 m, plus the surface-pressure offset.
  # theta is added to scalars automatically when needed, and a derived
  # variable carries derived_from = "theta" so it is never mistaken for
  # the model's own.
  # NOTE: PALM's `p` output is the PERTURBATION pressure and must not be
  # used as absolute pressure; it is deliberately ignored here.
  derive_ta: false

# --------------------------------------------------------------
# Stage: surfaces - SURFACE_DATA -> top-view GeoTIFF + wall quads
# --------------------------------------------------------------
surfaces:
  enabled: true
  file_from: OUTPUT/SURFACE_DATA_NETCDF_N02
  prefix: project_                    # output names: <prefix><var>_topview.tif,
                                      #               <prefix>walls.gpkg
  variables: ["theta_surface"]
  # Topmost upward-facing element per grid column (ground + roofs - what a
  # nadir thermal camera sees) -> one multiband GeoTIFF per variable,
  # band = timestep, band description = timestamp.
  write_topview_raster: true
  # The same top-view fields as a CF NetCDF, opened in QGIS as a MESH
  # layer (Add Layer -> Add Mesh Layer). MDAL reads the CF time axis
  # natively, so the Temporal Controller works with no style sidecar and
  # no band-to-time mapping - the reliable route for animation in QGIS.
  # All variables share one file, <prefix>surface_2d.nc, as separate
  # dataset groups. ArcGIS users can ignore it and use the GeoTIFFs.
  write_topview_netcdf: true
  # Wall elements -> vertical PolygonZ quads in a GeoPackage, long format
  # with a `time` field (enable time on the layer for the ArcGIS time
  # slider; view in a Local Scene for 3D wall temperatures). Grows as
  # n_walls x n_times rows - trim bounds/n_times for large domains.
  # Ensure `t_surf` (actual SURFACE temperature) is present. PALM's own
  # t_surf is used when the file has it; otherwise it is derived from the
  # surface POTENTIAL temperature - theta_surface or theta_surf, both
  # spellings accepted - at each face's own height. Appears in the
  # raster, the mesh NetCDF and the element layers alike.
  derive_ta: false
  write_walls_gpkg: true
  # EVERY surface element of the static driver geometry in one GeoPackage:
  # ground, roofs and all four wall orientations, each as a PolygonZ with
  # the configured variables. Extra columns: `orient` (up / down / wall_N /
  # wall_E / wall_S / wall_W) for symbology and filtering, `z` (absolute
  # face height) and `z_agl` (height above that column's terrain, which
  # separates roofs from ground even when buildings_2d is empty).
  # This is the complete surface-temperature picture and the largest
  # output - rows = n_elements x n_times, so keep bounds/n_times tight.
  write_all_elements_gpkg: false
  layer_name: null                    # layer name inside the GeoPackage

# --------------------------------------------------------------
# Stage: wind - 3D output -> wind vector point layer
# --------------------------------------------------------------
# Points carry u, v, speed and dir_met (meteorological direction, degrees
# FROM which the wind blows). Symbolise with an arrow marker rotated by
# dir_met (geographic rotation) and coloured/sized by speed.
wind:
  enabled: true
  file_from: OUTPUT/DATA_3D_NETCDF_N02
  file_to: project_wind.gpkg          # relative -> project.output_dir
  # Sampling heights above the LOCAL surface (terrain + buildings), so the
  # 2 m level follows streets AND rooftops - what pedestrian-level wind
  # maps need, unlike a fixed-z slice.
  heights_agl: [2.0, 10.0]
  stride: 4                           # keep every n-th grid column

# Write temperature variables (theta*, tsurf*/t_surf*, ta*) in degrees
# Celsius instead of kelvin, in every product: voxel NetCDF, top-view
# GeoTIFF + mesh NetCDF, and the GeoPackage element layers. Conversion
# happens at write time only - the ta derivation still runs in kelvin,
# NoData cells keep their -9999 fill value, and the NetCDF `units`
# attributes are set to "degC". Inputs must remain raw kelvin either way
# (the raw-input guard rejects pre-converted files).
celsius: false

# Write QGIS style sidecars next to every layer (<layer>.qml) and store the
# style inside each GeoPackage as well, so layers open with their time
# settings already configured: each raster band mapped to its time range
# (QGIS 3.38+ "Fixed Time Range Per Band"), and the `time` field recognised
# on the vector layers. ArcGIS ignores these files.
qgis_styles: true

# Pressure [Pa] at the model's z = 0 level (the domain base, at origin_z -
# NOT sea level). Used only when deriving air temperature. It matters: T
# scales as (p/p0)^0.286, so a 10 hPa error shifts the result by ~0.85 K -
# a constant offset, harmless for patterns and gradients, but relevant if
# you compare with measurements. Take it from your _p3d surface_pressure.
surface_pressure: 101325.0

# Stage order; also the default for the --stages CLI flag.
stages: [voxel, surfaces, wind]

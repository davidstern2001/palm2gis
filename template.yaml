# palm2gis - a template with all user-selectable configuration options.
#
# Conventions in this file:
#   uncommented       you have to set it (no usable default)
#   #commented        optional; the value shown is the default
#   ~                 null / not set
#   #inline           what the option does
#
# Defaults are applied before this file and merged deeply, so a project
# config only needs to state what differs. See config/example_minimal.yaml.
#
# Copy to config/<project>.yaml and run:
#   python run_palm2gis.py -c config/<project>.yaml

############################## GENERIC OPTIONS ##############################

project:
    name: 'project_name' #used in log messages and default output names
    root: '/storage/data/palm/project_name' #base for all relative paths below
    #output_dir: './gis' #all generated layers go here (relative to root)
    #overwrite: false #false: keep existing outputs and skip that product

# Stages to run, in order. A stage runs only if it is listed here AND its
# own `enabled` is true.
#stages: ['voxel', 'surfaces', 'wind', 'canopy']

crs:
    #palm: 'EPSG:32633' #CRS of origin_x/origin_y; all outputs use it

################################ INPUT FILES ################################
#
#   domain.static_driver   static driver (model input)   *_static*
#   domain.p3d             _p3d namelist (model input)   *_p3d*
#   voxel.file_from        3D output                     DATA_3D_NETCDF*
#   wind.file_from         3D output (the same file)     DATA_3D_NETCDF*
#   surfaces.file_from     surface output                SURFACE_DATA_NETCDF*
#   canopy.file_from       ~ -> domain.static_driver
#
# Only raw (or join-only) PALM output is accepted: local metre coordinates,
# kelvin, original variable layout.

domain:
    static_driver: 'INPUT/project_static_N02'
    p3d: 'INPUT/project_p3d_N02' #nz, dz, output intervals, surface_pressure
    #nz: ~ #default: from p3d
    #dz: ~ #default: from p3d
    #origin_time: ~ #default: origin_time attribute of the static driver

################################## BOUNDS ###################################

bounds:
    # Horizontal and vertical cut, in metres of the local PALM coordinates.
    # Default: the whole domain.
    #x0: ~
    #xmax: ~
    #y0: ~
    #ymax: ~
    #zmax: ~ #metres above the highest surface inside the cut

    # Timestep window in TIME (recommended). Resolved by each stage against
    # its own file, so files of different output interval cover the same
    # period. Both ends inclusive; either may be left ~ for the file's own
    # first/last record. Accepted:
    #   64800                   seconds since origin_time
    #   18h                     offset with a unit (s/min/h/d)
    #   '2023-08-24 13:00:00'   absolute timestamp
    #   '13:00'                 clock time, first occurrence after
    #                           origin_time (QUOTE it: unquoted YAML reads
    #                           a clock time as a number)
    #time_from: ~
    #time_to: ~

    # Timestep window in RECORD INDICES. Per file, so stages with different
    # output intervals will not cover the same period. Ignored when
    # time_from/time_to are set.
    #skip_times: 0 #records to skip from the start
    #n_times: 99999 #COUNT of records after skip_times
    #time_end: ~ #alternative to n_times: exclusive end index

    # Only needed when a file's time variable is all fill and the p3d gives
    # no output interval for that product.
    #time_step: ~ #default: from p3d
    #time_start: ~ #default: from p3d

############################## OUTPUT OPTIONS ###############################

#celsius: false #convert temperatures from kelvin to degrees C
#qgis_styles: true #write .qml style files next to the layers
#qgis_styles_3d: true #add a 3D renderer so Z survives in a 3D scene

# Pressure [Pa] at the model's z = 0 (the domain base at origin_z, NOT sea
# level), used only when deriving air temperature. Default: PALM's
# surface_pressure from the p3d, which the namelist gives in hPa. Set here
# only to override it, and then in PASCALS.
#surface_pressure: ~

################################### VOXEL ###################################
# 3D volume -> ArcGIS Pro voxel NetCDF (Local Scene -> Add Data ->
# Multidimensional Voxel Layer). Terrain and building cells are NoData.

voxel:
    #enabled: false
    file_from: 'OUTPUT/DATA_3D_NETCDF_N02'
    file_to: 'project_voxel.nc' #relative -> project.output_dir
    #do_velocity: true #destagger and write u, v, w
    #scalars: [] #copied and cut as-is, e.g. ['theta', 'rh']
    #drop_k0: true #drop z = 0 so the vertical spacing is uniform
    # Ensure `ta`, the AIR temperature: PALM's own if the file has it,
    # else derived as theta * Exner. The surface skin temperature is a
    # different quantity, called `t_surf` and produced by the surfaces
    # stage below - there is no such variable as ta_surf/ta_surface.
    #derive_ta: false

################################# SURFACES ##################################
# Surface elements -> top-view rasters + wall polygons.

surfaces:
    #enabled: false
    file_from: 'OUTPUT/SURFACE_DATA_NETCDF_N02'
    #prefix: 'palm_' #outputs: <prefix><var>_topview.tif, <prefix>walls.gpkg
    #variables: [] #e.g. ['theta_surface']
    # The stage can write the same surfaces in four forms. Turn off what
    # you do not use - each costs time and disk:
    #   topview_raster   the only form usable for raster work (map algebra,
    #                    zonal stats, differencing two scenarios); tiny
    #   topview_netcdf   the same data as a CF mesh layer, which QGIS
    #                    animates far better than a large vector layer
    #   walls_gpkg       vertical faces alone - a strict SUBSET of
    #                    write_all_elements_gpkg, so redundant when that
    #                    is on
    #   all_elements     every face (horizontal and vertical) in one layer;
    #                    the one to use for 3D scenes. Rows = elem x time
    #write_topview_raster: true
    #write_topview_netcdf: true
    #write_walls_gpkg: true
    #wall_lines: true #2D-visible traces of the walls (zero footprint in plan)
    #write_all_elements_gpkg: false
    #layer_name: ~ #default: derived from the output file name
    # Ensure `t_surf`, the surface SKIN temperature, from theta_surface
    # (which is a POTENTIAL temperature). Despite the key name this
    # does not produce `ta` - that is air temperature, from the voxel
    # stage.
    #derive_ta: false

################################### WIND ####################################
# Wind vectors sampled above the LOCAL surface, so the levels follow streets
# and rooftops alike. Points carry u, v, speed and dir_met (the direction
# the wind blows FROM).

wind:
    #enabled: false
    file_from: 'OUTPUT/DATA_3D_NETCDF_N02' #same file as voxel
    file_to: 'project_wind.gpkg' #relative -> project.output_dir
    #heights_agl: [2.0] #metres above the local surface
    #stride: 1 #sample every nth grid point in x and y

    # A second layer, `wind_3d`, of 3D arrows at the true sample height.
    # The point layer is 2D (height is an attribute only), so in a 3D
    # scene every level would otherwise collapse onto the ground.
    #write_lines_3d: false
    #arrow_scale: 2.0 #metres of arrow per m/s; suit it to the domain
    #include_w: false #tilt with vertical velocity; speed/dir_met stay
                      #horizontal either way

################################## CANOPY ###################################
# Plant canopy from the static driver. PALM stores `lad` on the `zlad` axis,
# i.e. height above the local terrain.

canopy:
    #enabled: false
    #file_from: ~ #~ -> domain.static_driver
    #prefix: 'palm_'
    #write_lai: true #<prefix>lai.tif - LAD integrated over the column [m2/m2]
    #write_canopy_height: true #<prefix>canopy_height.tif - highest LAD level
    #lad_threshold: 0.01 #LAD below this counts as no canopy
    # Voxel NetCDF of LAD (and BAD, the branch density, when the static
    # driver has it) lifted onto absolute heights, for an ArcGIS Pro
    # Local Scene alongside the voxel and surfaces layers. Carries a
    # single timestamp so it stays visible while the scene animates.
    #write_volume: false

# =====================================================================
# palm2gis - template listing every configuration setting
# =====================================================================
#
# HOW TO READ THIS FILE
#   * Uncommented lines have no usable default and must be set.
#     #commented lines are optional and show the default.
#   * A key listed as `a | b` accepts exactly one of those values.
#   * Every output is its own block with a `file:` line.
#       file: 'something.nc'   -> produced
#       file: null             -> skipped (as is a missing block)
#     Nothing is produced unless it has a filename.
#   * A stage runs when its section is present. `enabled: false` switches
#     it off without deleting its settings.
#   * In filenames, {name} is replaced by project.name.
#   * Input paths are relative to project.root, output filenames to
#     project.output_dir.
#   * An unknown or misspelt setting stops the run with a suggestion, so
#     a typo never goes unnoticed.
#   * Configs in the pre-0.20 layout (domain / bounds / file_from ...) and
#     the pre-0.25 names (celsius, height_above_highest_surface, the flat
#     advanced keys) still load; each is reported once at startup.
#
# Copy to config/<project>.yaml, keep what you need, and run:
#   python run_palm2gis.py -c config/<project>.yaml


# ---------------------------------------------------------------------
# 1. PROJECT
# ---------------------------------------------------------------------
project:
    name: 'project_name'         # used for {name} and in log messages
    root: '/storage/data/palm/project_name'   # base for input paths
    #output_dir: '.'             # where outputs go (relative to root)
    #overwrite: false            # false: keep existing outputs, fill gaps
    #output_crs: null            # CRS every output is WRITTEN in.
                                 # null = input.crs, unchanged.
                                 # 'EPSG:4326' for an ArcGIS scene in
                                 # WGS 84: vector layers are transformed
                                 # exactly (z untouched); voxel, wind and
                                 # canopy netCDF are resampled onto a
                                 # regular lon/lat grid of the same cell
                                 # size (advanced.netcdf.resampling), and
                                 # u/v are turned to true east/north.


# ---------------------------------------------------------------------
# 2. INPUT FILES   (shared by all stages)
# ---------------------------------------------------------------------
# Only raw (or join-only) PALM output is accepted: local metre
# coordinates, original units, original variable layout. palm_postproc's
# `joined` output is the right input; its `analysis` output is not.
input:
    static_driver: 'INPUT/project_static_N02'          # *_static*
    p3d:           'INPUT/project_p3d_N02'             # nz, dz, intervals,
                                                       # surface_pressure,
                                                       # pt_surface (a child
                                                       # falls back to the
                                                       # parent *_p3d)
    #dynamic_driver: null        # root domain only; default <job>_dynamic
                                 # next to the p3d
    data_3d:       'OUTPUT/DATA_3D_NETCDF_N02'         # voxel and wind
    surface_data:  'OUTPUT/SURFACE_DATA_NETCDF_N02'    # surfaces
    #crs: 'EPSG:32633'           # CRS of the static driver's origin_x/y


# ---------------------------------------------------------------------
# 3. REGION   what part of the domain to convert
# ---------------------------------------------------------------------
region:
    # Horizontal window in metres of LOCAL PALM coordinates, [from, to].
    #x: null                     # null = whole domain
    #y: null

    # Vertical extent, in metres ABOVE THE SURFACE BELOW: the terrain and
    # the rooftops, so the plane follows the buildings and the number of
    # levels kept varies across the domain. null = up to the top of the
    # file.
    #
    # This is a different reference from the rest of the chain, where a
    # height is measured from the domain base: palm_preproc's nz and
    # palm_postproc's region.z_max both count from there. A file that
    # palm_postproc has already cut cannot be extended here, and palm2gis
    # warns when it sees one.
    #height_above_surface: null


# ---------------------------------------------------------------------
# 4. TIME   which records to convert
# ---------------------------------------------------------------------
# Both ends inclusive; null = first / last record. Resolved against each
# file's own time axis, so a 10-minute 3D file and an hourly surface file
# cover the same period. Accepted:
#   '2023-08-24 13:00'   absolute time
#   '13:00'              clock time, first occurrence after origin_time
#   '6h' / '90min'       offset from origin_time
#   3600                 seconds since origin_time
# Always QUOTE clock times: unquoted, YAML reads 13:00 as a number.
time:
    #from: null
    #to: null


# ---------------------------------------------------------------------
# 5. VOXEL   3D volume for ArcGIS Pro voxel layers   (reads data_3d)
# ---------------------------------------------------------------------
# Local Scene -> Add Data -> Multidimensional Voxel Layer.
# Terrain and building cells are NoData.
voxel:
    #enabled: true
    # u, v, w (listed together) are moved from the staggered faces to cell
    # centres. Other names are copied as they are, e.g. theta, rh, q.
    # ta is PALM's own air temperature if the file has it, otherwise
    # derived from theta (which then must be in the file).
    # ah is PALM's own absolute humidity [g/m3] if the file has it,
    # otherwise derived from q (which then must be in the file).
    # speed_3d is the 3D wind speed sqrt(u^2+v^2+w^2) [m/s] at cell
    # centres; needs u, v, w in the file, but they need not be listed.
    variables: [u, v, w, theta]

    netcdf:
        file: '{name}_voxel.nc'


# ---------------------------------------------------------------------
# 6. SURFACES   ground, roofs and walls as 3D polygons  (reads surface_data)
# ---------------------------------------------------------------------
# One row per element per timestep, with orient (up / wall_N ...), z,
# z_agl and a time field for the time slider.
surfaces:
    #enabled: true
    # t_surface = actual skin temperature: PALM's own if the file has it,
    # otherwise derived from theta_surface (a POTENTIAL temperature).
    variables: [theta_surface, t_surface]

    all_elements_gpkg:           # GeoPackage; QGIS and ArcGIS
        file: '{name}_surfaces.gpkg'
    all_elements_fgdb:           # File Geodatabase; ArcGIS native, keeps
        file: null               # datetimes and long field names
    all_elements_multipatch:     # ESRI MultiPatch .shp; ArcGIS 3D Object
        file: null               # scene layers (10-character field names)


# ---------------------------------------------------------------------
# 7. WIND   sampled at heights above the local surface   (reads data_3d)
# ---------------------------------------------------------------------
# dir_met is the direction the wind blows FROM, clockwise from north.
wind:
    #enabled: true
    # Metres above the surface below - the same reference as
    # region.height_above_surface, so these heights follow terrain AND
    # rooftops.
    heights_above_surface: [2.0]

    netcdf:                      # (time, height, y, x): u, v, w, speed,
        file: '{name}_wind.nc'   # dir_met. ArcGIS Pro: Add Multidimensional
        #every_nth_column: 1     # Raster Layer -> Vector Field
    gpkg:                        # arrow points (+ optional 3D lines)
        file: null
        #every_nth_column: 1
        #arrows_3d: false        # extra LineStringZ layer at true height
        #arrow_length_per_ms: 2.0   # metres of arrow per m/s
        #tilt_with_w: false      # tilt 3D arrows with vertical velocity


# ---------------------------------------------------------------------
# 8. CANOPY   leaf area density from the static driver
# ---------------------------------------------------------------------
# LAD (and BAD, branch density, when present) lifted onto absolute
# heights. Carries one timestamp so it stays visible while a scene
# animates. The vertical cut applies, so check the region clears the
# tree tops.
canopy:
    #enabled: true
    lad_netcdf:
        file: '{name}_lad_3d.nc'


# ---------------------------------------------------------------------
# 9. ADVANCED   leave out unless you know you need it
# ---------------------------------------------------------------------
#advanced:

    # --- 9a. Units ----------------------------------------------------
    # The defaults are what the outputs should normally be: an air or
    # surface temperature in degrees C, a POTENTIAL temperature in K
    # (converting it would make the name meaningless). The same rule and
    # the same variable list as palm_postproc, so a directory cannot end
    # up mixing units.
    #units:
        #temperature: C          # K | C - ta, t_surface, tsurf*, ta_2m*
        #potential_temperature: K   # K only: theta and theta_surface are
                                 # kelvin-defined, so a Celsius value would
                                 # not be a potential temperature. List ta
                                 # or t_surface for an actual temperature.
        #overrides: {}           # for files whose units attribute is
                                 # unreadable, e.g. {ta_2m*_xy: C}

    # --- 9b. Grid -----------------------------------------------------
    # Normally read from input.p3d and the static driver.
    #grid:
        #nz: null                # grid levels; required without input.p3d
        #dz: null                # vertical spacing; required without p3d
        #origin_z: null          # domain base [m a.s.l.]; overrides the
                                 # static driver
        #origin_time: null       # overrides the static driver,
                                 # 'YYYY-MM-DD HH:MM:SS'

    # --- 9c. Basic state ----------------------------------------------
    # Used to derive ta, t_surface and ah. The default is what PALM
    # itself used, read from the dynamic driver, the p3d or the parent
    # p3d, and cross-checked against ta / theta in the data.
    #basic_state:
        #surface_pressure: null  # Pa at z = 0
        #pt_surface: null        # K

    # --- 9d. Output details -------------------------------------------
    #netcdf:
        #crs: wkt                # wkt | cf. wkt: ArcGIS shows the EPSG
                                 # WKID (e.g. 32633); cf: also CF
                                 # grid_mapping parameters for xarray,
                                 # ArcGIS then shows "Custom"
        #voxel_drop_k0: true     # drop z = 0 so vertical spacing is uniform
        #resampling: conservative  # conservative | nearest. Only with
                                 # project.output_crs: how voxel, wind and
                                 # canopy netCDF reach the new grid.
                                 # conservative: area-weighted average of
                                 #   the PALM cells each output cell
                                 #   overlaps, air cells only; keeps means
                                 #   and totals (PALM values are cell
                                 #   averages). Faster with scipy.
                                 # nearest: the PALM cell under each
                                 #   output cell centre; values exact,
                                 #   positions within half a cell.
    #qgis:
        #styles: true            # write .qml styles next to the layers
        #styles_3d: true         # add a 3D renderer to those styles
    #shapefile:
        #multipatch_split: 2000000   # rows before the .shp splits per
                                 # timestep
    #canopy_file_from: null      # LAD source; default input.static_driver

    # --- 9e. Record selection -----------------------------------------
    # Record indices instead of the time section, applied per file.
    #records:
        #skip: 0
        #count: null
        #end: null
    # Only when a file's time variable is empty and there is no p3d:
    #time_axis:
        #step: null              # seconds between records
        #start: null             # time of the first record
